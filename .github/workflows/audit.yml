name: audit
on:
  push: { branches: [ main ] }
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i -g html-validate @lhci/cli@0.14.x
      - name: HTML validate
        run: html-validate index.html 404.html || true
      - name: Lighthouse CI (static)
        run: |
          lhci autorun --collect.staticDistDir=./ \
            --collect.url=http://localhost/index.html \
            --collect.numberOfRuns=1 \
            --collect.settings.onlyCategories=performance,accessibility,best-practices,seo \
            --collect.settings.chromeFlags="--headless --no-sandbox --disable-dev-shm-usage" \
            --assert.assertions.categories:accessibility=["error",{"minScore":0.85}] \
            --assert.assertions.categories:performance=["warn",{"minScore":0.6}] \
            --upload.target=temporary-public-storage || true
